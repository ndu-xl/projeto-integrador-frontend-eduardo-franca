<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>SellCar</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
      <h1 id="title">Cadastro SellCar
      <img id="logo" src="assets/svg/logo.svg" alt="logo" width="150"></h1>
    </header>
    <main>
      <fieldset>
        <legend>Preencha as informações necessárias para começar</legend>
        <section>
          <p>Qual o seu nome:
          <input type="text" id="campo"/></p>
          <p>Qual o sua idade:
          <input type="number" id="campo"/></p>
          <p>Qual o seu email:
          <input type="email" id="campo"/></p>
          <p>Qual o seu telefone:
          <input type="number" id="campo"/></p>
          <p>Qual o seu cpf:
          <input type="number" id="campo"/></p>
          <p>Qual o seu cep:
          <input type="number" id="campo"/></p>
          <p>Informe o seu sexo:</p>
          <select>
            <option>Masculino</option>
            <option>Feminino</option>
          </select>
        </section>
      </fieldset>
      <br>
      <section>
        <button id="confirmar"><a href="pageMain.html">Confirmar Cadastro</a></button>
      </section>
    </main>
    <footer>
      <h4>&copyEduardo França</h4>
    </footer>
  </body>
</html>
