<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>SellCar</title>
  </head>
  <body>
    <header>
      <h1>Cadastro SellCar</h1>
      <img src="assets/svg/logo.svg" alt="" width="150">
    </header>
    <main>
      <fieldset>
        <legend>Preencha as informações necessárias para começar</legend>
        <section>
          <p>Qual o seu nome:</p>
          <input type="text" />
          <p>Qual o sua idade:</p>
          <input type="number" />
          <p>Qual o seu email:</p>
          <input type="email" />
          <p>Qual o seu telefone:</p>
          <input type="number" />
          <p>Qual o seu cpf:</p>
          <input type="number" />
          <p>Qual o seu cep:</p>
          <input type="number" />
          <p>Informe o seu sexo:</p>
          <select>
            <option>Masculino</option>
            <option>Feminino</option>
          </select>
        </section>
      </fieldset>
      <br>
      <section>
        <button><a href="pageMain.html">Confirmar Cadastro</a></button>
      </section>
    </main>
    <footer>
      <h4>&copyEduardo França</h4>
    </footer>
  </body>
</html>
